<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>rezToolsAi - Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        /* Navbar: Dibuat lebih ramping */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 12, 41, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .exit-link { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 18px; }
        
        .brand-name {
            font-size: 1.1rem; 
            font-weight: 800; 
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #a29bfe);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* Main Container: Diberi padding agar tidak menempel ke pinggir layar HP */
        .container {
            padding: 15px;
            max-width: 800px; /* Dibatasi agar tidak terlalu lebar di PC */
            margin: 0 auto;
        }

        /* Search Box: Lebih compact */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            animation: fadeInUp 0.6s ease-out;
        }

        input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        input:focus { border-color: #6c5ce7; }

        .search-btn {
            width: 45px;
            border-radius: 10px;
            border: none;
            background: #6c5ce7;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grid Results: 2 Kolom untuk HP, Jarak (Gap) pas */
        #results-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px;
        }

        /* Card: Ukuran gambar diperkecil agar pas di layar */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .card:active { transform: scale(0.97); }

        .card img {
            width: 100%;
            height: 140px; /* Tinggi gambar ideal untuk 2 kolom */
            object-fit: cover;
        }

        .card-info {
            padding: 8px;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 5px;
            height: 2.2rem;
            line-height: 1.1rem;
        }

        .card-meta {
            font-size: 0.65rem;
            display: flex;
            justify-content: space-between;
            color: #a29bfe;
            opacity: 0.8;
        }

        /* Loader */
        .loader {
            display: none;
            text-align: center;
            width: 100%;
            padding: 30px;
            color: #a29bfe;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive untuk layar lebih besar (Tablet/PC) */
        @media (min-width: 600px) {
            #results-container {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
            .card img { height: 200px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="https://rezatools-ai-website.vercel.app/" class="exit-link"><i class="fas fa-arrow-left"></i></a>
        <div class="brand-name">SEARCH HENTAI</div>
        <div style="width: 20px;"></div> </nav>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="Cari konten..." value="Anime">
            <button class="search-btn" onclick="performSearch()">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div id="loader" class="loader">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i>
        </div>

        <div id="results-container"></div>
    </div>

    <script>
        async function performSearch() {
            const query = document.getElementById('searchQuery').value;
            const container = document.getElementById('results-container');
            const loader = document.getElementById('loader');

            if (!query) return;

            container.innerHTML = '';
            loader.style.display = 'block';

            try {
                const response = await fetch(`https://api.sxtream.my.id/dewasa/thehentai-search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                loader.style.display = 'none';

                if (data.status === 200 && data.result.posts) {
                    data.result.posts.forEach((post) => {
                        const card = document.createElement('a');
                        card.className = 'card';
                        card.href = post.url;
                        card.target = '_blank';

                        card.innerHTML = `
                            <img src="${post.imgSrc}" alt="${post.title}" loading="lazy">
                            <div class="card-info">
                                <div class="card-title">${post.title}</div>
                                <div class="card-meta">
                                    <span><i class="far fa-eye"></i> ${post.views}</span>
                                    <span>${post.date}</span>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p style="text-align:center; width:100%; font-size:0.9rem;">Hasil tidak ditemukan.</p>';
                }
            } catch (error) {
                loader.style.display = 'none';
                container.innerHTML = '<p style="text-align:center; width:100%; color:#ff4757; font-size:0.8rem;">Gagal memuat data.</p>';
                console.error(error);
            }
        }

        window.onload = performSearch;

        document.getElementById('searchQuery').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });
    </script>

</body>
</html>
