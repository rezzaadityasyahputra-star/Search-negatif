<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Keamanan - Akses Dibatasi</title>
    <style>
        :root {
            --primary: #ff2d55;
            --secondary: #ff0000;
            --bg-dark: #080808;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* Background Animasi Partikel */
        .bg-animate {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a0505 0%, #080808 100%);
        }

        /* Card Utama Glassmorphism */
        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: floating 4s ease-in-out infinite;
        }

        .logo-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shield-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 0 30px rgba(255, 45, 85, 0.4);
            animation: pulse 2s infinite;
            z-index: 2;
        }

        .orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed var(--primary);
            border-radius: 50%;
            opacity: 0.3;
            animation: rotate 10s linear infinite;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 15px;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: rgba(255, 45, 85, 0.1);
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 45, 85, 0.3);
            text-transform: uppercase;
        }

        p {
            color: #aaa;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-request {
            position: relative;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 45, 85, 0.3);
        }

        .btn-request:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 45, 85, 0.5);
            letter-spacing: 1px;
        }

        .btn-request:disabled {
            cursor: not-allowed;
            filter: grayscale(1);
        }

        /* Scanline Effect */
        .card::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            border-radius: 24px;
            opacity: 0.3;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 45, 85, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 45, 85, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 45, 85, 0.4); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="bg-animate"></div>

    <div class="card">
        <div class="logo-container">
            <div class="orbit"></div>
            <div class="shield-icon">🔒</div>
        </div>

        <div class="status-badge">Access Denied</div>
        
        <h1>WEBSITE SEARCH <br><span style="color: var(--primary); -webkit-text-fill-color: var(--primary);">HENTAI</span></h1>
        
        <p>Akses ke kategori konten ini memerlukan <b>Izin Admin Level 4</b>. Sistem mendeteksi upaya masuk yang tidak sah.</p>
        
        <button class="btn-request" onclick="sendRequest(this)">
            MINTA IZIN AKSES
        </button>

        <div id="status-text" style="margin-top: 15px; font-size: 0.8rem; color: #555; display: none;">
            Mengirim permintaan ke server...
        </div>
    </div>

    <script>
        function sendRequest(btn) {
            // Animasi Loading
            btn.innerHTML = "MENYAMBUNGKAN...";
            btn.disabled = true;
            document.getElementById('status-text').style.display = "block";
            
            setTimeout(() => {
                // Data WhatsApp
                const phone = "6283116920767";
                const text = encodeURIComponent("Halo Admin, saya meminta izin akses Level 4 untuk kategori Website Search.");
                const waLink = "https://wa.me/" + phone + "?text=" + text;

                // Tampilkan Peringatan
                alert('PERINGATAN: Permintaan sedang diteruskan ke Administrator. Sesi Anda akan dialihkan ke WhatsApp.');

                // Eksekusi Redirect
                window.location.href = waLink;

                // Reset Tampilan Tombol
                btn.innerHTML = "DIALIHKAN";
                document.getElementById('status-text').innerText = "Status: Sedang Menghubungi Admin.";
                document.getElementById('status-text').style.color = "#ff2d55";
            }, 1500);
        }
    </script>
</body>
        </html>
